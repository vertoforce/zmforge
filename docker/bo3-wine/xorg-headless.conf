# A headless X server on an NVIDIA GPU, for the lighting bake.
#
# WHY not Xvfb: Xvfb's GLX is always Mesa's llvmpipe, whatever the container
# was given. Measured with --gpus all under Xvfb:
#   OpenGL renderer string: llvmpipe (LLVM 15.0.6, 256 bits)
# and radiant's wined3d then failed to link 246 GLSL programs. Xorg with the
# nvidia driver the container runtime injects (nvidia_drv.so and
# libglxserver_nvidia.so arrive with NVIDIA_DRIVER_CAPABILITIES=graphics)
# gives the real card:
#   OpenGL renderer string: NVIDIA GeForce <your GPU>/PCIe/SSE2
#
# No BusID: the container sees one GPU and Xorg finds it on its own.
# UseDisplayDevice None + AllowEmptyInitialConfiguration is the documented
# NVIDIA way to start with no monitor attached.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "Device"
    Identifier "gpu0"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "gpu0"
    Option "UseDisplayDevice" "None"
    DefaultDepth 24
    SubSection "Display"
        Virtual 1920 1080
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout0"
    Screen 0 "screen0"
EndSection
